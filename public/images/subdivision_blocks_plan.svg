<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="100%" height="100%">

<defs>
  <filter id="blockShadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
  </filter>
  <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
  </filter>
  <style>
    .bg { fill: rgba(248, 250, 252, 0.4); }
    .road-net { fill: #cbd5e1; fill-opacity: 0.35; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 4; }
    
    /* Block partition classes with exact colors from reference */
    .blk-1  { fill: #0284c7; fill-opacity: 0.28; stroke: #0284c7; stroke-width: 2.5; }
    .blk-2  { fill: #8b5cf6; fill-opacity: 0.32; stroke: #7c3aed; stroke-width: 2.5; }
    .blk-3  { fill: #ef4444; fill-opacity: 0.22; stroke: #dc2626; stroke-width: 2.5; }
    .blk-4  { fill: #f97316; fill-opacity: 0.30; stroke: #ea580c; stroke-width: 2.5; }
    .blk-5  { fill: #a855f7; fill-opacity: 0.30; stroke: #9333ea; stroke-width: 2.5; }
    .blk-6  { fill: #22c55e; fill-opacity: 0.32; stroke: #16a34a; stroke-width: 2.5; }
    .blk-7  { fill: #d97706; fill-opacity: 0.30; stroke: #b45309; stroke-width: 2.5; }
    .blk-8  { fill: #84cc16; fill-opacity: 0.32; stroke: #65a30d; stroke-width: 2.5; }
    .blk-9  { fill: #f43f5e; fill-opacity: 0.30; stroke: #e11d48; stroke-width: 2.5; }
    .blk-10 { fill: #ec4899; fill-opacity: 0.32; stroke: #db2777; stroke-width: 2.5; }
    .blk-11 { fill: #6366f1; fill-opacity: 0.34; stroke: #4f46e5; stroke-width: 2.5; }
    .blk-12 { fill: #fb7185; fill-opacity: 0.32; stroke: #e11d48; stroke-width: 2.5; }
    .blk-13 { fill: #eab308; fill-opacity: 0.34; stroke: #ca8a04; stroke-width: 2.5; }
    .blk-14 { fill: #3b82f6; fill-opacity: 0.32; stroke: #2563eb; stroke-width: 2.5; }

    /* Badges */
    .badge-bg { rx: 12; filter: url(#badgeShadow); }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.6px; user-select: none; }
    
    /* Start markers */
    .start-flag { rx: 8; fill: #ffffff; stroke: #0f172a; stroke-width: 1.2; filter: url(#badgeShadow); }
    .start-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 7.5px; font-weight: 800; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    
    /* Boundary */
    .subd-geofence { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 4; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; fill: #0f172a; letter-spacing: 0.5px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8px; font-weight: 600; fill: #64748b; }
    .street-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8px; font-weight: 700; fill: #475569; text-anchor: middle; }
  </style>
</defs>

